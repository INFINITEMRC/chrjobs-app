# Codemagic — ASC API key via group app_store_credentials
# Required secrets in group app_store_credentials:
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_KEY_IDENTIFIER
#   APP_STORE_CONNECT_PRIVATE_KEY   (Base64 of AuthKey .p8)
#   CERTIFICATE_PRIVATE_KEY        (Base64 of Distribution RSA key — from build log)

workflows:
  ios-app-store:
    name: CHR Jobs iOS → App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_PROJECT: "ios/CHRJobs/CHRJobs.xcodeproj"
        XCODE_SCHEME: "CHRJobs"
        BUNDLE_ID: "com.chrjobs.jobs"
      xcode: latest
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Prepare App Store Connect API key
        script: |
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > /tmp/AuthKey.p8
          if ! grep -q "BEGIN PRIVATE KEY" /tmp/AuthKey.p8 2>/dev/null; then
            printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/AuthKey.p8
          fi
          head -n 1 /tmp/AuthKey.p8
      - name: Fetch or create signing files
        script: |
          set -e
          ASC=(
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID"
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER"
            --private-key @file:/tmp/AuthKey.p8
          )

          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "ERROR: Add CERTIFICATE_PRIVATE_KEY (Base64) to Codemagic group app_store_credentials"
            echo "Use the Base64 printed by the previous build under SAVE THIS as Codemagic secret"
            exit 1
          fi

          echo "$CERTIFICATE_PRIVATE_KEY" | base64 --decode > /tmp/distribution.key
          if ! grep -qE "BEGIN|PRIVATE" /tmp/distribution.key 2>/dev/null; then
            printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > /tmp/distribution.key
          fi
          echo "Using CERTIFICATE_PRIVATE_KEY"

          # Delete orphan Distribution certs so we can create one for our private key
          for TYPE in IOS_DISTRIBUTION DISTRIBUTION; do
            echo "Listing certificates type=$TYPE"
            app-store-connect certificates list \
              "${ASC[@]}" \
              --type "$TYPE" \
              --json > "/tmp/certs_$TYPE.json" || true
            python3 - <<PY
          import json, subprocess, os, sys
          path = "/tmp/certs_$TYPE.json"
          try:
              raw = open(path).read().strip()
              if not raw:
                  sys.exit(0)
              data = json.loads(raw)
          except Exception as e:
              print("skip list parse:", e)
              sys.exit(0)
          items = data if isinstance(data, list) else data.get("data") or data.get("certificates") or []
          for c in items:
              cid = c.get("id") if isinstance(c, dict) else None
              if not cid:
                  continue
              print("Deleting certificate", cid)
              subprocess.run([
                  "app-store-connect", "certificates", "delete", cid,
                  "--issuer-id", os.environ["APP_STORE_CONNECT_ISSUER_ID"],
                  "--key-id", os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"],
                  "--private-key", "@file:/tmp/AuthKey.p8",
              ], check=False)
          PY
          done

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/distribution.key \
            "${ASC[@]}"
          keychain add-certificates
      - name: Apply provisioning profiles to Xcode project
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Publish IPA to TestFlight
        script: |
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > /tmp/AuthKey.p8
          IPA_PATH="$(ls build/ios/ipa/*.ipa | head -n 1)"
          echo "Publishing $IPA_PATH"
          app-store-connect publish \
            --path "$IPA_PATH" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key @file:/tmp/AuthKey.p8 \
            --testflight
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
