# Codemagic — ASC API key via group app_store_credentials
# APP_STORE_CONNECT_PRIVATE_KEY = Base64 of the .p8 file
# Optional: CERTIFICATE_PRIVATE_KEY = Base64 of RSA key (reuse Distribution cert across builds)

workflows:
  ios-app-store:
    name: CHR Jobs iOS → App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_PROJECT: "ios/CHRJobs/CHRJobs.xcodeproj"
        XCODE_SCHEME: "CHRJobs"
        BUNDLE_ID: "com.chrjobs.jobs"
      xcode: latest
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Prepare App Store Connect API key
        script: |
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > /tmp/AuthKey.p8
          if ! grep -q "BEGIN PRIVATE KEY" /tmp/AuthKey.p8 2>/dev/null; then
            printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/AuthKey.p8
          fi
          head -n 1 /tmp/AuthKey.p8
      - name: Fetch or create signing files
        script: |
          set -e
          if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "$CERTIFICATE_PRIVATE_KEY" | base64 --decode > /tmp/distribution.key
            if ! grep -qE "BEGIN|PRIVATE" /tmp/distribution.key 2>/dev/null; then
              printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > /tmp/distribution.key
            fi
            echo "Using CERTIFICATE_PRIVATE_KEY from environment"
          else
            openssl genrsa -out /tmp/distribution.key 2048
            echo "===== SAVE THIS as Codemagic secret CERTIFICATE_PRIVATE_KEY (Base64) ====="
            base64 -i /tmp/distribution.key | tr -d '\n'
            echo
            echo "====="
          fi

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/distribution.key \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key @file:/tmp/AuthKey.p8
          keychain add-certificates
      - name: Apply provisioning profiles to Xcode project
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Publish IPA to TestFlight
        script: |
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > /tmp/AuthKey.p8
          IPA_PATH="$(ls build/ios/ipa/*.ipa | head -n 1)"
          echo "Publishing $IPA_PATH"
          app-store-connect publish \
            --path "$IPA_PATH" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key @file:/tmp/AuthKey.p8 \
            --testflight
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/distribution.key
