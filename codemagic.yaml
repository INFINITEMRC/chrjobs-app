# Codemagic config (repo root) — auto-creates App Store signing files via ASC API

workflows:
  ios-app-store:
    name: CHR Jobs iOS → App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Must match the name of your App Store Connect integration in Codemagic Teams
      app_store_connect: codemagic
    environment:
      vars:
        XCODE_PROJECT: "ios/CHRJobs/CHRJobs.xcodeproj"
        XCODE_SCHEME: "CHRJobs"
        BUNDLE_ID: "com.chrjobs.jobs"
      xcode: latest
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch or create signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
